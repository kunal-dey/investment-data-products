type: dagster_dlt.DltLoadCollectionComponent

attributes:
  loads:
    - source: .loads.kite_mf_instruments
      pipeline: .loads.kite_pipeline
      translation: &extract
        group_name: extract
    - source: .loads.kite_instruments
      pipeline: .loads.kite_instruments_pipeline
      translation: *extract
    - source: .loads.macro_ingest
      pipeline: .loads.macro_pipeline
      translation: *extract
    - source: .loads.nse_etf
      pipeline: .loads.nse_etf_pipeline
      translation: *extract
    - source: .loads.etf_bars
      pipeline: .loads.etf_bars_pipeline
      translation:
        group_name: extract
        deps:
          - "{{ env.GLUE_DATABASE }}"
          - nse_etfs

requirements:
  env:
    - S3_LAKE_BASE
    - GLUE_DATABASE
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
