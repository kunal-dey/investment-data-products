name: Sync dbt into Dagster

# After you split this folder into its own repo, this file lives at
# .github/workflows/sync-dbt.yml in the dbt repo.
# Required on the dbt repo:
#   secrets.DAGSTER_REPO_TOKEN  — PAT or GitHub App token with contents:write on the Dagster repo
#   vars.DAGSTER_REPO           — e.g. your-org/investment-data-products

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dbt repo
        uses: actions/checkout@v4

      - name: Checkout Dagster repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DAGSTER_REPO }}
          token: ${{ secrets.DAGSTER_REPO_TOKEN }}
          path: dagster-repo

      - name: Replace dagster-repo/dbt
        run: |
          set -euo pipefail
          rm -rf dagster-repo/dbt
          mkdir -p dagster-repo/dbt
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'target' \
            --exclude 'logs' \
            --exclude 'dbt_packages' \
            --exclude '.user.yml' \
            ./ dagster-repo/dbt/

      - name: Commit and push
        working-directory: dagster-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbt
          if git diff --cached --quiet; then
            echo "No dbt changes to sync."
            exit 0
          fi
          git commit -m "chore: sync dbt from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
