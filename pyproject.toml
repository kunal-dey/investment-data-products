[project]
name = "investment_data_products"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.25",
    "dagster-aws>=0.29.25",
    "dagster-dbt>=0.29.25",
    "dagster-dlt>=0.29.25",
    "dbt-duckdb>=1.11.0",
    "dlt[athena,pyiceberg,s3]>=1.31.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "investment_data_products"
registry_modules = [
    "investment_data_products.components.*",
]


