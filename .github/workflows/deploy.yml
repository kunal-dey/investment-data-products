name: Deploy Dagster

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --python 3.12

      - name: Validate components
        run: uv run dg check yaml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/investment_data_products
            sudo -u dagster git fetch origin
            sudo -u dagster git reset --hard origin/main
            sudo -u dagster bash -lc 'export PATH="$HOME/.local/bin:$PATH"; set -a; [ -f /etc/investment_data_products.env ] && . /etc/investment_data_products.env; set +a; cd /opt/investment_data_products; uv python install 3.12; uv sync --group dev --python 3.12; uv run dbt parse --project-dir dbt --profiles-dir dbt'
            sudo cp /opt/investment_data_products/deploy/dagster-webserver.service /etc/systemd/system/
            sudo cp /opt/investment_data_products/deploy/dagster-daemon.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now dagster-webserver dagster-daemon
            sudo systemctl restart dagster-webserver dagster-daemon
