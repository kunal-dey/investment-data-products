name: Deploy Dagster

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install
        run: uv sync

      - name: Validate components
        run: uv run dg check yaml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/investment_data_products
            sudo -u dagster git fetch origin
            sudo -u dagster git reset --hard origin/main
            sudo -u dagster bash -lc 'export PATH="$HOME/.local/bin:$PATH"; cd /opt/investment_data_products; uv sync --group dev'
            sudo systemctl restart dagster-webserver dagster-daemon
